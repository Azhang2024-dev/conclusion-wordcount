[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "conclusion-wordcount"
version = "1.1.0"
description = "Extract a paper's conclusion section and count its words, with a confidence score and review queue."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Azhang2024-dev" }]
keywords = ["pdf", "corpus-linguistics", "word-count", "conclusion", "phrase-frames"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = ["pypdfium2>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
wcengine = "wcengine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
